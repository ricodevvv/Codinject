name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, must match gradle.properties and have a section in CHANGELOG.md
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Check version
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version $VERSION"; exit 1; }
          [ "$(grep '^version=' gradle.properties | cut -d= -f2)" = "$VERSION" ] || { echo "gradle.properties is not at $VERSION"; exit 1; }
          awk -v v="## $VERSION" '$0 == v {found=1; next} found && /^## / {exit} found' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
      - run: ./gradlew build
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" build/libs/*.jar --target "$GITHUB_SHA" --title "$VERSION" --notes-file notes.md
